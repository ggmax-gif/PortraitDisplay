# XcodeGen spec for the native iPad viewer. Generate with `xcodegen` in this folder (the .xcodeproj
# is not committed); iPad/README.md has the build and install commands.
name: PortraitViewer
options:
  bundleIdPrefix: com.danielfung
  deploymentTarget:
    iOS: "17.0"
targets:
  # The same Sources/Shared the Mac host builds with SwiftPM: framing, direct Wi-Fi TLS and pairing,
  # gesture decisions (tested by Tests/SharedTests).
  Shared:
    type: framework
    platform: iOS
    sources: [../Sources/Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielfung.PortraitDisplay.Shared
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
  PortraitViewer:
    type: application
    platform: iOS
    sources: [PortraitViewer]
    dependencies:
      - target: Shared
    info:
      path: PortraitViewer/Info.plist
      properties:
        CFBundleDisplayName: Portrait Display
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown]
        NSLocalNetworkUsageDescription: Lets your paired Mac connect over Wi-Fi when the USB cable isn't plugged in.
        NSBonjourServices: [_portraitdisplay._tcp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danielfung.PortraitDisplay.Viewer
        TARGETED_DEVICE_FAMILY: "2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
